{% assign study = include.study %}
<article class="case-card{% if study.featured %} primary-case{% endif %}">
  <p class="eyebrow">{{ study.study_type | default: 'Engineering project' }}</p>
  <h3><a href="{{ study.url | relative_url }}">{{ study.card_title | default: study.title }}</a></h3>
  <p>{{ study.excerpt | strip_html }}</p>
  <a class="text-link" href="{{ study.url | relative_url }}">Read more<span class="visually-hidden">: {{ study.card_title | default: study.title }}</span> {% include icon.html name="arrow-up-right" %}</a>
</article>
