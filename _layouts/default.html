<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
  <link rel="icon" href="{{ '/images/ek-mark-grenat.svg' | relative_url }}" type="image/svg+xml">
  <meta name="theme-color" content="#fbf9f9">
  <link rel="alternate" type="application/atom+xml" title="Emmanuel Konan - Articles" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/professional.css' | relative_url }}">
  <script src="{{ '/assets/js/professional.js' | relative_url }}" defer></script>
  {% if page.math %}<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include masthead.html %}
  <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
