<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="icon" href="{{ '/images/ek-mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/images/ek-icon-192.png' | relative_url }}">
  <meta name="theme-color" content="#f8f9fb">
  <link rel="alternate" type="application/atom+xml" title="Emmanuel Konan - Articles" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/professional.css' | relative_url }}">

</html>
